<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Seily</title>
<style>
  :root {
    --bg-color: var(--tg-theme-bg-color, #0f0f10);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
    --text-color: var(--tg-theme-text-color, #ffffff);
    --hint-color: var(--tg-theme-hint-color, #8e8e93);
    --accent: #7c5cff;
    --accent-2: #4a9eff;
    --border: rgba(128,128,128,0.18);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-color);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }

  body.modal-open { overflow: hidden; }

  /* ===== Header ===== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    flex-shrink: 0;
  }

  .app-logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--secondary-bg);
    border: none;
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .header-btn:active { transform: scale(0.92); }

  /* ===== Content ===== */
  .content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 100px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    contain: layout style paint;
  }
  .content::-webkit-scrollbar { display: none; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ===== Empty state ===== */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 80px 20px;
    color: var(--hint-color);
    text-align: center;
  }
  .empty-state svg { opacity: 0.5; }
  .empty-state p { font-size: 15px; font-weight: 600; }
  .empty-state small {
    font-size: 13px;
    opacity: 0.7;
    max-width: 260px;
    line-height: 1.4;
  }

  /* ===== Create tab ===== */
  .create-intro { padding: 40px 0 20px; text-align: center; }
  .create-intro-icon {
    width: 72px; height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: #fff;
  }
  .create-intro h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .create-intro p { font-size: 14px; color: var(--hint-color); line-height: 1.4; }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

  /* ===== Account ===== */
  .account-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 20px;
  }

  .account-avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    border: 3px solid var(--bg-color);
    box-shadow: 0 0 0 3px var(--accent);
    margin-bottom: 14px;
    position: relative;
  }
  .account-avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .account-name { font-size: 20px; font-weight: 800; }
  .account-username { font-size: 14px; color: var(--hint-color); margin-top: 3px; }

  .account-hint {
    font-size: 12px;
    color: var(--hint-color);
    text-align: center;
    margin-top: 8px;
    max-width: 280px;
    line-height: 1.4;
    opacity: 0.8;
  }

  .account-list {
    background: var(--secondary-bg);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-top: 20px;
  }

  .account-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:active { background: rgba(128,128,128,0.12); }

  .account-row-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .account-row-label { flex: 1; font-size: 15px; font-weight: 500; }
  .account-row-value { font-size: 13px; color: var(--hint-color); margin-right: 6px; }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--secondary-bg);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    background: none;
    border: none;
    color: var(--hint-color);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
    font-family: inherit;
  }
  .nav-item:active { transform: scale(0.94); }
  .nav-item.active { color: var(--accent); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 200;
    will-change: opacity;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--secondary-bg);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translate3d(0, 100%, 0);
    transition: transform .32s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 201;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
    scrollbar-width: none;
    will-change: transform;
  }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.open { transform: translate3d(0, 0, 0); }
  .sheet.dragging { transition: none; }

  .sheet-handle {
    width: 44px;
    height: 5px;
    background: var(--hint-color);
    opacity: 0.45;
    border-radius: 3px;
    margin: 0 auto 18px;
    cursor: grab;
    touch-action: none;
    position: relative;
    transition: opacity .2s ease;
  }
  .sheet-handle:active { opacity: 0.85; cursor: grabbing; }
  .sheet-handle::before {
    content: '';
    position: absolute;
    top: -18px; left: -60px; right: -60px; bottom: -18px;
  }

  .sheet-title { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 22px; }

  /* ===== Form ===== */
  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint-color);
    margin-bottom: 8px;
    padding-left: 4px;
  }

  .form-input, .form-textarea {
    width: 100%;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--text-color);
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 90px; resize: none; line-height: 1.5; }

  /* ===== Photo upload ===== */
  .photo-row { display: flex; justify-content: center; margin-bottom: 20px; }

  .photo-upload {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--bg-color);
    border: 2px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    color: var(--hint-color);
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    position: relative;
    text-align: center;
    transition: border-color .15s ease, background .15s ease;
  }
  .photo-upload:active { border-color: var(--accent); background: rgba(124,92,255,0.06); }
  .photo-upload.has-image { border-style: solid; border-color: var(--accent); }
  .photo-upload > img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .photo-upload .overlay-edit {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    opacity: 0;
    transition: opacity .2s ease;
    z-index: 2;
  }
  .photo-upload.has-image .overlay-edit { opacity: 1; }

  /* ===== Modal actions ===== */
  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }

  .btn-ghost {
    flex: 1;
    background: rgba(128,128,128,0.14);
    color: var(--text-color);
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s ease;
  }
  .btn-ghost:active { transform: scale(0.97); }
  .sheet-actions .btn-primary { flex: 2; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">Seily</div>
  <button class="header-btn" id="searchBtn" aria-label="Поиск" data-icon="search" data-size="20"></button>
</header>

<main class="content">

  <section class="tab-panel active" id="panel-home">
    <div class="empty-state">
      <div data-icon="inbox" data-size="48"></div>
      <p>Здесь пусто</p>
      <small>Создайте своего первого персонажа, чтобы начать</small>
    </div>
  </section>

  <section class="tab-panel" id="panel-chats">
    <div class="empty-state">
      <div data-icon="message-circle" data-size="48"></div>
      <p>Здесь пусто</p>
      <small>Ваши диалоги появятся здесь</small>
    </div>
  </section>

  <section class="tab-panel" id="panel-create">
    <div class="create-intro">
      <div class="create-intro-icon" data-icon="sparkles" data-size="32"></div>
      <h3>Создайте персонажа</h3>
      <p>Придумайте характер, внешность и стиль общения — и общайтесь</p>
    </div>
    <button class="btn-primary" id="openCreateBtn">
      <span data-icon="plus" data-size="18"></span>
      <span>Создать персонажа</span>
    </button>
  </section>

  <section class="tab-panel" id="panel-account">
    <div class="account-top">
      <div class="account-avatar" id="userAvatar">?</div>
      <div class="account-name" id="userName">Загрузка…</div>
      <div class="account-username" id="userUsername"></div>
      <div class="account-hint" id="userHint"></div>
    </div>

    <div class="account-list">
      <div class="account-row">
        <div class="account-row-icon" data-icon="user" data-size="18"></div>
        <div class="account-row-label">Профиль</div>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="settings" data-size="18"></div>
        <div class="account-row-label">Настройки</div>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="moon" data-size="18"></div>
        <div class="account-row-label">Тема</div>
        <span class="account-row-value" id="themeLabel">Auto</span>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="info" data-size="18"></div>
        <div class="account-row-label">О приложении</div>
        <span class="account-row-value">v1.0</span>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="home">
    <span data-icon="home" data-size="22"></span>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-tab="chats">
    <span data-icon="message-circle" data-size="22"></span>
    <span>Чаты</span>
  </button>
  <button class="nav-item" data-tab="create">
    <span data-icon="plus-circle" data-size="22"></span>
    <span>Создать</span>
  </button>
  <button class="nav-item" data-tab="account">
    <span data-icon="user" data-size="22"></span>
    <span>Аккаунт</span>
  </button>
</nav>

<div class="modal-overlay" id="modalOverlay"></div>

<div class="sheet" id="createSheet" role="dialog" aria-modal="true">
  <div class="sheet-handle" id="sheetHandle"></div>
  <h2 class="sheet-title">Новый персонаж</h2>

  <div class="photo-row">
    <label class="photo-upload" id="photoUpload">
      <input type="file" id="charPhoto" accept="image/*" hidden>
      <span data-icon="image-plus" data-size="22"></span>
      <span>Добавить фото</span>
      <div class="overlay-edit">
        <span data-icon="pencil" data-size="22"></span>
      </div>
    </label>
  </div>

  <div class="form-group">
    <label class="form-label" for="charName">Имя</label>
    <input class="form-input" id="charName" type="text" placeholder="Например: Aiko" maxlength="40" autocomplete="off">
  </div>

  <div class="form-group">
    <label class="form-label" for="charDesc">Описание</label>
    <textarea class="form-textarea" id="charDesc" placeholder="Кто это, откуда, чем занимается…"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label" for="charGreet">Приветствие</label>
    <textarea class="form-textarea" id="charGreet" placeholder="Первое сообщение от персонажа…"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label" for="charTraits">Характеристика</label>
    <textarea class="form-textarea" id="charTraits" placeholder="Характер, манера общения, интересы…"></textarea>
  </div>

  <div class="sheet-actions">
    <button class="btn-ghost" id="cancelBtn">Отмена</button>
    <button class="btn-primary" id="saveBtn">
      <span data-icon="check" data-size="18"></span>
      <span>Создать</span>
    </button>
  </div>
</div>

<script>
/* =========================================================
   1. ICON SYSTEM (inline SVG — быстро, без CDN)
   ========================================================= */
const ICONS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  'plus-circle': '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
  'image-plus': '<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><line x1="16" x2="22" y1="5" y2="5"/><line x1="19" x2="19" y1="2" y2="8"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>'
};

function renderIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach(el => {
    const name = el.dataset.icon;
    const path = ICONS[name];
    if (!path) return;
    const size = el.dataset.size || 24;
    el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
    el.removeAttribute('data-icon');
  });
}
renderIcons();

/* =========================================================
   2. STATE
   ========================================================= */
const state = {
  tg: null,
  user: null,
  isTelegram: false
};

/* =========================================================
   3. TELEGRAM WEBAPP
   ========================================================= */
function initTelegram() {
  const tg = window.Telegram?.WebApp;
  if (!tg || !tg.initData && !tg.initDataUnsafe?.user) {
    // Открыто вне Telegram WebApp окружения
    state.isTelegram = false;
    state.user = null;
    return;
  }
  state.tg = tg;
  state.isTelegram = true;

  try {
    tg.ready();
    tg.expand?.();
    tg.setHeaderColor?.('secondary_bg_color');
    tg.setBackgroundColor?.('bg_color');
    tg.enableClosingConfirmation?.();
    tg.onEvent?.('themeChanged', updateThemeLabel);
    tg.onEvent?.('activated', renderUser);
  } catch (e) { console.warn(e); }

  state.user = readUser(tg);
}

function readUser(tg) {
  // initDataUnsafe.user — стандартный путь
  const unsafe = tg?.initDataUnsafe?.user;
  if (unsafe && unsafe.id) return unsafe;

  // fallback — парсим initData
  const raw = tg?.initData;
  if (raw) {
    try {
      const params = new URLSearchParams(raw);
      const userJson = params.get('user');
      if (userJson) {
        const u = JSON.parse(userJson);
        if (u && u.id) return u;
      }
    } catch (e) { console.warn(e); }
  }
  return null;
}

/* =========================================================
   4. RENDER USER
   ========================================================= */
function renderUser() {
  const avatarEl   = document.getElementById('userAvatar');
  const nameEl     = document.getElementById('userName');
  const usernameEl = document.getElementById('userUsername');
  const hintEl     = document.getElementById('userHint');

  if (state.user) {
    const u = state.user;
    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Пользователь';
    const initial  = (u.first_name || fullName || '?').trim().charAt(0).toUpperCase() || '?';

    nameEl.textContent = fullName;
    usernameEl.textContent = u.username ? '@' + u.username : (u.id ? 'ID: ' + u.id : '');
    hintEl.textContent = '';

    if (u.photo_url) {
      avatarEl.innerHTML = '';
      const img = new Image();
      img.referrerPolicy = 'no-referrer';
      img.decoding = 'async';
      img.onload = () => {
        avatarEl.innerHTML = '';
        avatarEl.appendChild(img);
      };
      img.onerror = () => { avatarEl.textContent = initial; };
      img.src = u.photo_url;
    } else {
      avatarEl.textContent = initial;
    }
    return;
  }

  // Нет пользователя
  avatarEl.textContent = '?';
  if (state.isTelegram) {
    nameEl.textContent = 'Профиль недоступен';
    usernameEl.textContent = '';
    hintEl.textContent = 'Откройте приложение через кнопку Web App в боте (t.me/ваш_бот/app), чтобы увидеть данные';
  } else {
    nameEl.textContent = 'Не в Telegram';
    usernameEl.textContent = '';
    hintEl.textContent = 'Данные профиля отображаются только внутри Telegram WebApp';
  }
}

/* =========================================================
   5. THEME
   ========================================================= */
function updateThemeLabel() {
  const el = document.getElementById('themeLabel');
  if (!el) return;
  const scheme = state.tg?.colorScheme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  el.textContent = scheme === 'dark' ? 'Dark' : 'Light';
}

/* =========================================================
   6. TABS
   ========================================================= */
function switchTab(tabName) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('panel-' + tabName)?.classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');
  document.querySelector('.content')?.scrollTo({ top: 0, behavior: 'auto' });
  state.tg?.HapticFeedback?.selectionChanged?.();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* =========================================================
   7. BOTTOM SHEET
   ========================================================= */
const sheet = document.getElementById('createSheet');
const overlay = document.getElementById('modalOverlay');
const handle = document.getElementById('sheetHandle');

function openSheet() {
  overlay.classList.add('open');
  sheet.classList.add('open');
  document.body.classList.add('modal-open');
  state.tg?.HapticFeedback?.impactOccurred?.('medium');
}

function closeSheet() {
  overlay.classList.remove('open');
  sheet.classList.remove('open');
  document.body.classList.remove('modal-open');
  sheet.style.transform = '';
  state.tg?.HapticFeedback?.impactOccurred?.('light');
}

overlay.addEventListener('click', closeSheet);
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('openCreateBtn').addEventListener('click', openSheet);

// Drag-to-close
let dragStartY = 0;
let dragDelta = 0;
let isDragging = false;
let isDraggingSheet = false;

function dragStart(y, fromSheet) {
  isDragging = true;
  isDraggingSheet = fromSheet;
  dragStartY = y;
  dragDelta = 0;
  sheet.classList.add('dragging');
}

function dragMove(y) {
  if (!isDragging) return;
  dragDelta = y - dragStartY;
  if (dragDelta < 0) dragDelta = 0;
  sheet.style.transform = `translate3d(0, ${dragDelta}px, 0)`;
}

function dragEnd() {
  if (!isDragging) return;
  isDragging = false;
  sheet.classList.remove('dragging');
  if (dragDelta > 110) {
    closeSheet();
  } else {
    sheet.style.transform = '';
  }
  dragDelta = 0;
}

// Handle — всегда тянет
handle.addEventListener('touchstart', e => dragStart(e.touches[0].clientY, true), { passive: true });
handle.addEventListener('mousedown', e => { e.preventDefault(); dragStart(e.clientY, true); });

// Sheet — тянет вниз только когда скролл в самом верху
sheet.addEventListener('touchstart', e => {
  if (sheet.scrollTop <= 0) dragStart(e.touches[0].clientY, false);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const y = e.touches[0].clientY;
  if (isDraggingSheet || dragDelta > 0 || (y - dragStartY) > 0) {
    dragMove(y);
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);

document.addEventListener('mousemove', e => { if (isDragging) dragMove(e.clientY); });
document.addEventListener('mouseup', dragEnd);

/* =========================================================
   8. PHOTO UPLOAD
   ========================================================= */
const photoInput = document.getElementById('charPhoto');
const photoUpload = document.getElementById('photoUpload');
let selectedPhotoData = null;

function bindPhotoInput() {
  photoInput.addEventListener('change', () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      selectedPhotoData = reader.result;
      // Пересобираем содержимое (без потери input)
      const existingImg = photoUpload.querySelector('img');
      if (existingImg) existingImg.remove();
      const img = document.createElement('img');
      img.src = selectedPhotoData;
      img.alt = '';
      photoUpload.insertBefore(img, photoUpload.firstChild);
      photoUpload.classList.add('has-image');
    };
    reader.readAsDataURL(file);
  });
}
bindPhotoInput();

function resetPhoto() {
  selectedPhotoData = null;
  const existingImg = photoUpload.querySelector('img');
  if (existingImg) existingImg.remove();
  photoUpload.classList.remove('has-image');
  photoInput.value = '';
}

/* =========================================================
   9. CREATE CHARACTER
   ========================================================= */
document.getElementById('saveBtn').addEventListener('click', () => {
  const name   = document.getElementById('charName').value.trim();
  const desc   = document.getElementById('charDesc').value.trim();
  const greet  = document.getElementById('charGreet').value.trim();
  const traits = document.getElementById('charTraits').value.trim();

  if (!name) {
    state.tg?.HapticFeedback?.notificationOccurred?.('error');
    if (state.tg?.showAlert) state.tg.showAlert('Введите имя персонажа');
    else alert('Введите имя персонажа');
    return;
  }

  const character = {
    name, description: desc, greeting: greet, traits,
    photo: selectedPhotoData,
    createdAt: Date.now()
  };

  console.log('[Seily] Character:', character);
  state.tg?.HapticFeedback?.notificationOccurred?.('success');

  if (state.tg?.showPopup) {
    state.tg.showPopup({
      title: 'Персонаж создан!',
      message: `${name} готов к общению`,
      buttons: [{ type: 'ok' }]
    });
  } else {
    alert('Персонаж создан: ' + name);
  }

  // Reset
  document.getElementById('charName').value = '';
  document.getElementById('charDesc').value = '';
  document.getElementById('charGreet').value = '';
  document.getElementById('charTraits').value = '';
  resetPhoto();

  closeSheet();
});

/* =========================================================
   10. SEARCH
   ========================================================= */
document.getElementById('searchBtn').addEventListener('click', () => {
  state.tg?.HapticFeedback?.impactOccurred?.('light');
});

/* =========================================================
   11. BOOT
   ========================================================= */
function boot() {
  initTelegram();
  renderUser();
  updateThemeLabel();

  // Резервная перерисовка — вдруг initData пришёл позже
  if (state.isTelegram && !state.user) {
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      const u = readUser(state.tg);
      if (u) {
        state.user = u;
        renderUser();
        clearInterval(t);
      }
      if (tries >= 15) clearInterval(t);
    }, 200);
  }

  console.log('[Seily] boot', {
    isTelegram: state.isTelegram,
    user: state.user
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>

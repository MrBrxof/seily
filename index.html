<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Seily</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
  /* ===== Telegram theme variables with fallback ===== */
  :root {
    --bg-color: var(--tg-theme-bg-color, #0f0f10);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
    --text-color: var(--tg-theme-text-color, #ffffff);
    --hint-color: var(--tg-theme-hint-color, #8e8e93);
    --link-color: var(--tg-theme-link-color, #4a9eff);
    --button-color: var(--tg-theme-button-color, #4a9eff);
    --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    --accent: #7c5cff;
    --accent-2: #4a9eff;
    --border: rgba(128,128,128,0.18);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }

  /* ===== Header ===== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    flex-shrink: 0;
  }

  .app-logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--secondary-bg);
    border: none;
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }

  .header-btn:active {
    transform: scale(0.92);
  }

  /* ===== Content ===== */
  .content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 100px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .tab-panel { display: none; animation: fade .25s ease; }
  .tab-panel.active { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Home ===== */
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--hint-color);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 18px 4px 12px;
  }

  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    border-radius: 20px;
    padding: 20px;
    color: #fff;
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }
  .hero h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
    position: relative;
  }
  .hero p {
    font-size: 14px;
    opacity: 0.9;
    position: relative;
    line-height: 1.4;
  }

  /* ===== Cards grid ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .card {
    background: var(--secondary-bg);
    border-radius: 18px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: transform .15s ease;
    border: 1px solid var(--border);
  }
  .card:active { transform: scale(0.97); }

  .card-avatar {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 800;
    color: #fff;
  }

  .card-name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-desc {
    font-size: 12px;
    color: var(--hint-color);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Chats list ===== */
  .chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 6px;
    cursor: pointer;
    border-radius: 14px;
    transition: background .15s ease;
  }
  .chat-item:active { background: var(--secondary-bg); }

  .chat-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-last {
    font-size: 13px;
    color: var(--hint-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== Create tab ===== */
  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint-color);
    margin-bottom: 8px;
    padding-left: 4px;
  }

  .form-input, .form-textarea {
    width: 100%;
    background: var(--secondary-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text-color);
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease;
  }
  .form-input:focus, .form-textarea:focus {
    border-color: var(--accent);
  }
  .form-textarea {
    min-height: 110px;
    resize: none;
    line-height: 1.5;
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

  /* ===== Account tab ===== */
  .account-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 20px;
  }

  .account-avatar-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin-bottom: 14px;
  }

  .account-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    border: 3px solid var(--bg-color);
    box-shadow: 0 0 0 3px var(--accent);
  }
  .account-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .account-name {
    font-size: 20px;
    font-weight: 800;
  }

  .account-username {
    font-size: 14px;
    color: var(--hint-color);
    margin-top: 3px;
  }

  .account-list {
    background: var(--secondary-bg);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .account-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:active { background: rgba(128,128,128,0.12); }

  .account-row-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .account-row-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .account-row-value {
    font-size: 13px;
    color: var(--hint-color);
    margin-right: 6px;
  }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--secondary-bg);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    background: none;
    border: none;
    color: var(--hint-color);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
    font-family: inherit;
  }
  .nav-item:active { transform: scale(0.94); }
  .nav-item.active { color: var(--accent); }
  .nav-item.active svg { filter: drop-shadow(0 0 6px rgba(124,92,255,0.5)); }
  .nav-item svg { transition: transform .2s ease; }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-logo">Seily</div>
  <button class="header-btn" id="searchBtn" aria-label="Поиск">
    <i data-lucide="search" size="20"></i>
  </button>
</header>

<!-- Content -->
<main class="content">

  <!-- ====== ГЛАВНАЯ ====== -->
  <section class="tab-panel active" id="panel-home">
    <div class="hero">
      <h2>Привет 👋</h2>
      <p>Создавай своих AI-персонажей и общайся с ними в Seily</p>
    </div>

    <div class="section-title">Популярные</div>
    <div class="grid" id="popularGrid"></div>

    <div class="section-title">Новые</div>
    <div class="grid" id="newGrid"></div>
  </section>

  <!-- ====== ЧАТЫ ====== -->
  <section class="tab-panel" id="panel-chats">
    <div class="section-title">Ваши диалоги</div>
    <div id="chatsList"></div>
  </section>

  <!-- ====== СОЗДАТЬ ====== -->
  <section class="tab-panel" id="panel-create">
    <div class="section-title">Новый персонаж</div>

    <div class="form-group">
      <label class="form-label">Имя</label>
      <input class="form-input" id="charName" placeholder="Например: Aiko" maxlength="40">
    </div>

    <div class="form-group">
      <label class="form-label">Описание / характер</label>
      <textarea class="form-textarea" id="charDesc" placeholder="Опиши характер, стиль общения, интересы..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Приветствие</label>
      <textarea class="form-textarea" id="charGreet" placeholder="Первое сообщение от персонажа..."></textarea>
    </div>

    <button class="btn-primary" id="createBtn">
      <i data-lucide="sparkles" size="18"></i>
      <span>Создать персонажа</span>
    </button>
  </section>

  <!-- ====== АККАУНТ ====== -->
  <section class="tab-panel" id="panel-account">
    <div class="account-top">
      <div class="account-avatar-wrap">
        <div class="account-avatar" id="userAvatar">?</div>
      </div>
      <div class="account-name" id="userName">Загрузка...</div>
      <div class="account-username" id="userUsername"></div>
    </div>

    <div class="account-list">
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="user" size="18"></i></div>
        <div class="account-row-label">Профиль</div>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="star" size="18"></i></div>
        <div class="account-row-label">Подписка</div>
        <span class="account-row-value">Free</span>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="settings" size="18"></i></div>
        <div class="account-row-label">Настройки</div>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="moon" size="18"></i></div>
        <div class="account-row-label">Тема</div>
        <span class="account-row-value" id="themeLabel">Auto</span>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="info" size="18"></i></div>
        <div class="account-row-label">О приложении</div>
        <span class="account-row-value">v1.0</span>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
    </div>
  </section>

</main>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="home">
    <i data-lucide="home" size="22"></i>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-tab="chats">
    <i data-lucide="message-circle" size="22"></i>
    <span>Чаты</span>
  </button>
  <button class="nav-item" data-tab="create">
    <i data-lucide="plus-circle" size="22"></i>
    <span>Создать</span>
  </button>
  <button class="nav-item" data-tab="account">
    <i data-lucide="user" size="22"></i>
    <span>Аккаунт</span>
  </button>
</nav>

<script>
  // ==================== Утилиты ====================

  // Ждём, пока Telegram.WebApp появится в window (SDK грузится асинхронно)
  function waitForTelegram(timeout = 3000) {
    return new Promise(resolve => {
      if (window.Telegram?.WebApp) return resolve(window.Telegram.WebApp);
      const start = Date.now();
      const tick = () => {
        if (window.Telegram?.WebApp) return resolve(window.Telegram.WebApp);
        if (Date.now() - start >= timeout) return resolve(null);
        setTimeout(tick, 40);
      };
      tick();
    });
  }

  // Парсим initData вручную (на случай, если initDataUnsafe пустой)
  function parseInitData(initData) {
    try {
      if (!initData) return {};
      const params = new URLSearchParams(initData);
      const out = {};
      for (const [k, v] of params.entries()) {
        if (k === 'user' || k === 'chat' || k === 'receiver') {
          try { out[k] = JSON.parse(v); } catch { out[k] = v; }
        } else out[k] = v;
      }
      return out;
    } catch { return {}; }
  }

  // Единая точка получения юзера
  function getTelegramUser(tg) {
    if (!tg) return null;
    if (tg.initDataUnsafe?.user) return tg.initDataUnsafe.user;
    const parsed = parseInitData(tg.initData);
    if (parsed.user) return parsed.user;
    return null;
  }

  // ==================== Состояние ====================

  const state = {
    tg: null,
    user: null,
    isTelegram: false,
    demoUser: {
      first_name: 'Seily',
      last_name: 'User',
      username: 'seily',
      id: 0,
      photo_url: null
    }
  };

  // ==================== Данные персонажей ====================

  const popularChars = [
    { emoji: '🤖', name: 'Aiko', desc: 'Дружелюбный AI-помощник на все случаи жизни' },
    { emoji: '🐉', name: 'Drakon', desc: 'Древний дракон, знающий тысячи историй' },
    { emoji: '🎭', name: 'Luna', desc: 'Загадочная художница с чувством юмора' },
    { emoji: '⚔️', name: 'Kai', desc: 'Мастер боевых искусств и философ' }
  ];

  const newChars = [
    { emoji: '🌙', name: 'Nyx', desc: 'Ночной страж, говорит загадками' },
    { emoji: '📚', name: 'Sage', desc: 'Библиотекарь всех знаний мира' },
    { emoji: '🎮', name: 'Pixel', desc: 'Геймер и стример, всегда онлайн' },
    { emoji: '🍜', name: 'Ramen', desc: 'Шеф-повар, любит поговорить о еде' }
  ];

  const chats = [
    { emoji: '🤖', name: 'Aiko', last: 'Привет! Чем могу помочь сегодня?', time: 'сейчас' },
    { emoji: '🎭', name: 'Luna', last: 'Нарисовала новую картину, хочешь глянуть?', time: '12:30' },
    { emoji: '📚', name: 'Sage', last: 'Знаешь ли ты о теории струн?', time: 'вчера' },
    { emoji: '🎮', name: 'Pixel', last: 'Го катку вечером?', time: 'вчера' }
  ];

  // ==================== Рендер ====================

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderCards(containerId, items) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = items.map(c => `
      <div class="card">
        <div class="card-avatar">${c.emoji}</div>
        <div class="card-name">${esc(c.name)}</div>
        <div class="card-desc">${esc(c.desc)}</div>
      </div>
    `).join('');
  }

  function renderChats() {
    const el = document.getElementById('chatsList');
    if (!el) return;
    el.innerHTML = chats.map(c => `
      <div class="chat-item">
        <div class="chat-avatar">${c.emoji}</div>
        <div class="chat-info">
          <div class="chat-name">${esc(c.name)}</div>
          <div class="chat-last">${esc(c.last)}</div>
        </div>
      </div>
    `).join('');
  }

  function renderUser() {
    const avatarEl   = document.getElementById('userAvatar');
    const nameEl     = document.getElementById('userName');
    const usernameEl = document.getElementById('userUsername');
    if (!avatarEl || !nameEl || !usernameEl) return;

    const u = state.user || state.demoUser;
    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Пользователь';
    const initial  = (u.first_name || fullName || '?').trim().charAt(0).toUpperCase() || '?';

    nameEl.textContent = fullName;

    if (u.username) {
      usernameEl.textContent = '@' + u.username;
    } else if (u.id) {
      usernameEl.textContent = 'ID: ' + u.id;
    } else {
      usernameEl.textContent = state.isTelegram ? '' : 'демо-режим';
    }

    // Аватарка
    if (u.photo_url) {
      avatarEl.innerHTML = '';
      const img = new Image();
      img.alt = fullName;
      img.referrerPolicy = 'no-referrer';
      img.crossOrigin = 'anonymous';
      img.onload  = () => { avatarEl.innerHTML = ''; avatarEl.appendChild(img); };
      img.onerror = () => { avatarEl.textContent = initial; };
      img.src = u.photo_url;
    } else {
      avatarEl.textContent = initial;
    }
  }

  function updateThemeLabel() {
    const el = document.getElementById('themeLabel');
    if (!el) return;
    const scheme = state.tg?.colorScheme
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    el.textContent = scheme === 'dark' ? 'Dark' : 'Light';
  }

  function refreshIcons() {
    if (window.lucide?.createIcons) {
      try { lucide.createIcons(); } catch (e) { console.warn('lucide error', e); }
    }
  }

  // ==================== Табы ====================

  function switchTab(tabName) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('panel-' + tabName)?.classList.add('active');
    document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');
    document.querySelector('.content')?.scrollTo({ top: 0, behavior: 'smooth' });
    state.tg?.HapticFeedback?.selectionChanged?.();
    refreshIcons();
  }

  // ==================== Инициализация ====================

  async function init() {
    // 1) Рендерим контент сразу (не ждём Telegram)
    renderCards('popularGrid', popularChars);
    renderCards('newGrid', newChars);
    renderChats();

    // 2) Ждём Telegram SDK
    const tg = await waitForTelegram(2500);
    state.tg = tg;
    state.isTelegram = !!tg;

    if (tg) {
      try {
        tg.ready();
        tg.expand?.();
        tg.setHeaderColor?.('secondary_bg_color');
        tg.setBackgroundColor?.('bg_color');
        tg.enableClosingConfirmation?.();

        tg.onEvent?.('themeChanged', () => {
          updateThemeLabel();
          refreshIcons();
        });

        tg.onEvent?.('activated', () => {
          renderUser();
        });
      } catch (e) { console.warn('tg init warn', e); }
    }

    // 3) Получаем пользователя
    state.user = getTelegramUser(tg) || state.demoUser;

    // 4) Рендерим данные юзера
    renderUser();
    updateThemeLabel();

    // 5) Иконки — ПОСЛЕ всего рендера
    refreshIcons();

    // 6) Навигация
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // 7) Создание персонажа
    document.getElementById('createBtn')?.addEventListener('click', () => {
      const name  = document.getElementById('charName').value.trim();
      const desc  = document.getElementById('charDesc').value.trim();
      const greet = document.getElementById('charGreet').value.trim();

      if (!name) {
        state.tg?.HapticFeedback?.notificationOccurred?.('error');
        if (state.tg?.showAlert) state.tg.showAlert('Введите имя персонажа');
        else alert('Введите имя персонажа');
        return;
      }

      state.tg?.HapticFeedback?.notificationOccurred?.('success');

      const msg = `${name} готов к общению`;
      if (state.tg?.showPopup) {
        state.tg.showPopup({
          title: 'Персонаж создан!',
          message: msg,
          buttons: [{ type: 'ok' }]
        });
      } else {
        alert('Персонаж создан: ' + name);
      }

      document.getElementById('charName').value  = '';
      document.getElementById('charDesc').value  = '';
      document.getElementById('charGreet').value = '';
    });

    // 8) Кнопка поиска
    document.getElementById('searchBtn')?.addEventListener('click', () => {
      state.tg?.HapticFeedback?.impactOccurred?.('light');
    });

    // Отладка
    console.log('[Seily] Telegram:', state.isTelegram, 'user:', state.user);
  }

  // Запуск
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>

</body>
</html>

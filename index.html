<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Seily</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
  :root {
    --bg-color: var(--tg-theme-bg-color, #0f0f10);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
    --text-color: var(--tg-theme-text-color, #ffffff);
    --hint-color: var(--tg-theme-hint-color, #8e8e93);
    --link-color: var(--tg-theme-link-color, #4a9eff);
    --button-color: var(--tg-theme-button-color, #4a9eff);
    --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    --accent: #7c5cff;
    --accent-2: #4a9eff;
    --border: rgba(128,128,128,0.18);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }

  body.modal-open {
    overflow: hidden;
  }

  /* ===== Header ===== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    flex-shrink: 0;
  }

  .app-logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--secondary-bg);
    border: none;
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .header-btn:active { transform: scale(0.92); }

  /* ===== Content ===== */
  .content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 100px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .tab-panel { display: none; animation: fade .25s ease; }
  .tab-panel.active { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Empty state ===== */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 80px 20px;
    color: var(--hint-color);
    text-align: center;
  }
  .empty-state svg { opacity: 0.5; }
  .empty-state p {
    font-size: 15px;
    font-weight: 600;
  }
  .empty-state small {
    font-size: 13px;
    opacity: 0.7;
    max-width: 260px;
    line-height: 1.4;
  }

  /* ===== Create tab ===== */
  .create-intro {
    padding: 40px 0 20px;
    text-align: center;
  }
  .create-intro-icon {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: #fff;
  }
  .create-intro h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .create-intro p {
    font-size: 14px;
    color: var(--hint-color);
    line-height: 1.4;
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

  /* ===== Account ===== */
  .account-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 20px;
  }

  .account-avatar-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin-bottom: 14px;
  }

  .account-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    border: 3px solid var(--bg-color);
    box-shadow: 0 0 0 3px var(--accent);
  }
  .account-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .account-name {
    font-size: 20px;
    font-weight: 800;
  }

  .account-username {
    font-size: 14px;
    color: var(--hint-color);
    margin-top: 3px;
  }

  .account-list {
    background: var(--secondary-bg);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .account-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:active { background: rgba(128,128,128,0.12); }

  .account-row-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .account-row-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .account-row-value {
    font-size: 13px;
    color: var(--hint-color);
    margin-right: 6px;
  }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--secondary-bg);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    background: none;
    border: none;
    color: var(--hint-color);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
    font-family: inherit;
  }
  .nav-item:active { transform: scale(0.94); }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { transition: transform .2s ease; }

  /* ===== Modal overlay ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 200;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* ===== Bottom sheet ===== */
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--secondary-bg);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 201;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
    scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.open { transform: translateY(0); }
  .sheet.dragging { transition: none; }

  .sheet-handle {
    width: 44px;
    height: 5px;
    background: var(--hint-color);
    opacity: 0.45;
    border-radius: 3px;
    margin: 0 auto 18px;
    cursor: grab;
    touch-action: none;
    position: relative;
    transition: opacity .2s ease;
  }
  .sheet-handle:active { opacity: 0.8; cursor: grabbing; }
  .sheet-handle::before {
    content: '';
    position: absolute;
    top: -16px; left: -60px; right: -60px; bottom: -16px;
  }

  .sheet-title {
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 22px;
  }

  /* ===== Form fields ===== */
  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint-color);
    margin-bottom: 8px;
    padding-left: 4px;
  }

  .form-input, .form-textarea {
    width: 100%;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text-color);
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea {
    min-height: 90px;
    resize: none;
    line-height: 1.5;
  }

  /* ===== Photo upload ===== */
  .photo-row {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .photo-upload {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--bg-color);
    border: 2px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    color: var(--hint-color);
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    transition: border-color .15s ease, background .15s ease;
    position: relative;
    text-align: center;
  }
  .photo-upload:active {
    border-color: var(--accent);
    background: rgba(124,92,255,0.06);
  }
  .photo-upload img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-upload.has-image {
    border-style: solid;
    border-color: var(--accent);
  }
  .photo-upload .overlay-edit {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .photo-upload.has-image .overlay-edit { opacity: 1; }

  /* ===== Modal actions ===== */
  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .btn-ghost {
    flex: 1;
    background: rgba(128,128,128,0.14);
    color: var(--text-color);
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s ease;
  }
  .btn-ghost:active { transform: scale(0.97); }

  .sheet-actions .btn-primary { flex: 2; }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-logo">Seily</div>
  <button class="header-btn" id="searchBtn" aria-label="Поиск">
    <i data-lucide="search" size="20"></i>
  </button>
</header>

<!-- Content -->
<main class="content">

  <!-- ГЛАВНАЯ -->
  <section class="tab-panel active" id="panel-home">
    <div class="empty-state">
      <i data-lucide="inbox" size="48"></i>
      <p>Здесь пусто</p>
      <small>Создайте своего первого персонажа, чтобы начать</small>
    </div>
  </section>

  <!-- ЧАТЫ -->
  <section class="tab-panel" id="panel-chats">
    <div class="empty-state">
      <i data-lucide="message-circle" size="48"></i>
      <p>Здесь пусто</p>
      <small>Ваши диалоги появятся здесь</small>
    </div>
  </section>

  <!-- СОЗДАТЬ -->
  <section class="tab-panel" id="panel-create">
    <div class="create-intro">
      <div class="create-intro-icon">
        <i data-lucide="sparkles" size="32"></i>
      </div>
      <h3>Создайте персонажа</h3>
      <p>Придумайте характер, внешность и стиль общения — и общайтесь</p>
    </div>

    <button class="btn-primary" id="openCreateBtn">
      <i data-lucide="plus" size="18"></i>
      <span>Создать персонажа</span>
    </button>
  </section>

  <!-- АККАУНТ -->
  <section class="tab-panel" id="panel-account">
    <div class="account-top">
      <div class="account-avatar-wrap">
        <div class="account-avatar" id="userAvatar">?</div>
      </div>
      <div class="account-name" id="userName">Загрузка...</div>
      <div class="account-username" id="userUsername"></div>
    </div>

    <div class="account-list">
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="user" size="18"></i></div>
        <div class="account-row-label">Профиль</div>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="settings" size="18"></i></div>
        <div class="account-row-label">Настройки</div>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="moon" size="18"></i></div>
        <div class="account-row-label">Тема</div>
        <span class="account-row-value" id="themeLabel">Auto</span>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
      <div class="account-row">
        <div class="account-row-icon"><i data-lucide="info" size="18"></i></div>
        <div class="account-row-label">О приложении</div>
        <span class="account-row-value">v1.0</span>
        <i data-lucide="chevron-right" size="18" style="color:var(--hint-color)"></i>
      </div>
    </div>
  </section>

</main>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="home">
    <i data-lucide="home" size="22"></i>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-tab="chats">
    <i data-lucide="message-circle" size="22"></i>
    <span>Чаты</span>
  </button>
  <button class="nav-item" data-tab="create">
    <i data-lucide="plus-circle" size="22"></i>
    <span>Создать</span>
  </button>
  <button class="nav-item" data-tab="account">
    <i data-lucide="user" size="22"></i>
    <span>Аккаунт</span>
  </button>
</nav>

<!-- Modal overlay -->
<div class="modal-overlay" id="modalOverlay"></div>

<!-- Bottom sheet -->
<div class="sheet" id="createSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle" id="sheetHandle"></div>
  <h2 class="sheet-title" id="sheetTitle">Новый персонаж</h2>

  <!-- Photo -->
  <div class="photo-row">
    <label class="photo-upload" id="photoUpload">
      <input type="file" id="charPhoto" accept="image/*" hidden>
      <i data-lucide="image-plus" size="22"></i>
      <span>Добавить фото</span>
      <div class="overlay-edit">
        <i data-lucide="pencil" size="22"></i>
      </div>
    </label>
  </div>

  <!-- Name -->
  <div class="form-group">
    <label class="form-label" for="charName">Имя</label>
    <input class="form-input" id="charName" type="text" placeholder="Например: Aiko" maxlength="40">
  </div>

  <!-- Description -->
  <div class="form-group">
    <label class="form-label" for="charDesc">Описание</label>
    <textarea class="form-textarea" id="charDesc" placeholder="Кто это, откуда, чем занимается..."></textarea>
  </div>

  <!-- Greeting -->
  <div class="form-group">
    <label class="form-label" for="charGreet">Приветствие</label>
    <textarea class="form-textarea" id="charGreet" placeholder="Первое сообщение от персонажа..."></textarea>
  </div>

  <!-- Characteristics -->
  <div class="form-group">
    <label class="form-label" for="charTraits">Характеристика</label>
    <textarea class="form-textarea" id="charTraits" placeholder="Характер, манера общения, интересы..."></textarea>
  </div>

  <div class="sheet-actions">
    <button class="btn-ghost" id="cancelBtn">Отмена</button>
    <button class="btn-primary" id="saveBtn">
      <i data-lucide="check" size="18"></i>
      <span>Создать</span>
    </button>
  </div>
</div>

<script>
  // ==================== Telegram utils ====================

  function waitForTelegram(timeout = 3000) {
    return new Promise(resolve => {
      if (window.Telegram?.WebApp) return resolve(window.Telegram.WebApp);
      const start = Date.now();
      const tick = () => {
        if (window.Telegram?.WebApp) return resolve(window.Telegram.WebApp);
        if (Date.now() - start >= timeout) return resolve(null);
        setTimeout(tick, 40);
      };
      tick();
    });
  }

  function parseInitData(initData) {
    try {
      if (!initData) return {};
      const params = new URLSearchParams(initData);
      const out = {};
      for (const [k, v] of params.entries()) {
        if (k === 'user' || k === 'chat' || k === 'receiver') {
          try { out[k] = JSON.parse(v); } catch { out[k] = v; }
        } else out[k] = v;
      }
      return out;
    } catch { return {}; }
  }

  function getTelegramUser(tg) {
    if (!tg) return null;
    if (tg.initDataUnsafe?.user) return tg.initDataUnsafe.user;
    const parsed = parseInitData(tg.initData);
    if (parsed.user) return parsed.user;
    return null;
  }

  // Ждём появления пользователя (initData иногда подгружается с задержкой)
  async function waitForUser(tg, timeout = 4000) {
    if (!tg) return null;
    const start = Date.now();
    while (Date.now() - start < timeout) {
      const u = getTelegramUser(tg);
      if (u) return u;
      await new Promise(r => setTimeout(r, 100));
    }
    return getTelegramUser(tg);
  }

  // ==================== State ====================

  const state = {
    tg: null,
    user: null,
    isTelegram: false
  };

  // ==================== Rendering helpers ====================

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function refreshIcons() {
    if (window.lucide?.createIcons) {
      try { lucide.createIcons(); } catch (e) { console.warn('lucide error', e); }
    }
  }

  function renderUser() {
    const avatarEl   = document.getElementById('userAvatar');
    const nameEl     = document.getElementById('userName');
    const usernameEl = document.getElementById('userUsername');
    if (!avatarEl || !nameEl || !usernameEl) return;

    const u = state.user;

    if (!u) {
      avatarEl.textContent = '?';
      nameEl.textContent = state.isTelegram ? 'Не удалось загрузить' : 'Вне Telegram';
      usernameEl.textContent = state.isTelegram
        ? 'Откройте через кнопку в боте'
        : 'Данные доступны только в Telegram';
      return;
    }

    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Пользователь';
    const initial  = (u.first_name || fullName || '?').trim().charAt(0).toUpperCase() || '?';

    nameEl.textContent = fullName;

    if (u.username) {
      usernameEl.textContent = '@' + u.username;
    } else if (u.id) {
      usernameEl.textContent = 'ID: ' + u.id;
    } else {
      usernameEl.textContent = '';
    }

    if (u.photo_url) {
      avatarEl.innerHTML = '';
      const img = new Image();
      img.alt = fullName;
      img.referrerPolicy = 'no-referrer';
      img.onload  = () => { avatarEl.innerHTML = ''; avatarEl.appendChild(img); };
      img.onerror = () => { avatarEl.textContent = initial; };
      img.src = u.photo_url;
    } else {
      avatarEl.textContent = initial;
    }
  }

  function updateThemeLabel() {
    const el = document.getElementById('themeLabel');
    if (!el) return;
    const scheme = state.tg?.colorScheme
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    el.textContent = scheme === 'dark' ? 'Dark' : 'Light';
  }

  // ==================== Tabs ====================

  function switchTab(tabName) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('panel-' + tabName)?.classList.add('active');
    document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');
    document.querySelector('.content')?.scrollTo({ top: 0, behavior: 'smooth' });
    state.tg?.HapticFeedback?.selectionChanged?.();
    refreshIcons();
  }

  // ==================== Bottom sheet ====================

  const sheet = document.getElementById('createSheet');
  const overlay = document.getElementById('modalOverlay');
  const handle = document.getElementById('sheetHandle');

  function openSheet() {
    overlay.classList.add('open');
    sheet.classList.add('open');
    document.body.classList.add('modal-open');
    state.tg?.HapticFeedback?.impactOccurred?.('medium');
  }

  function closeSheet() {
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    document.body.classList.remove('modal-open');
    sheet.style.transform = '';
    state.tg?.HapticFeedback?.impactOccurred?.('light');
  }

  overlay.addEventListener('click', closeSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);

  // Drag-to-close
  let dragStartY = 0;
  let dragCurrentY = 0;
  let isDragging = false;

  function onDragStart(clientY) {
    isDragging = true;
    dragStartY = clientY;
    dragCurrentY = 0;
    sheet.classList.add('dragging');
  }

  function onDragMove(clientY) {
    if (!isDragging) return;
    dragCurrentY = clientY - dragStartY;
    if (dragCurrentY < 0) dragCurrentY = 0;
    // Затухание при большом сдвиге
    const eased = dragCurrentY > 0 ? dragCurrentY : 0;
    sheet.style.transform = `translateY(${eased}px)`;
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    sheet.classList.remove('dragging');
    if (dragCurrentY > 120) {
      closeSheet();
    } else {
      sheet.style.transform = '';
    }
    dragCurrentY = 0;
  }

  // Touch events на handle
  handle.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove', e => {
    if (!isDragging) return;
    onDragMove(e.touches[0].clientY);
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', onDragEnd);

  // Mouse events (для теста на ПК)
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    onDragStart(e.clientY);
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    onDragMove(e.clientY);
  });
  document.addEventListener('mouseup', onDragEnd);

  // ==================== Photo upload ====================

  const photoInput = document.getElementById('charPhoto');
  const photoUpload = document.getElementById('photoUpload');
  let selectedPhotoData = null;

  photoInput.addEventListener('change', () => {
    const file = photoInput.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      selectedPhotoData = reader.result;
      photoUpload.classList.add('has-image');
      // Удаляем иконки/текст, ставим изображение
      photoUpload.innerHTML = `
        <img src="${selectedPhotoData}" alt="">
        <div class="overlay-edit">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
        <input type="file" id="charPhoto" accept="image/*" hidden>
      `;
      // Переподключаем input
      const newInput = photoUpload.querySelector('input');
      newInput.addEventListener('change', () => {
        photoInput.click();
      });
      newInput.addEventListener('click', e => {
        e.stopPropagation();
        photoInput.click();
      });
    };
    reader.readAsDataURL(file);
  });

  // ==================== Create character ====================

  document.getElementById('openCreateBtn').addEventListener('click', openSheet);

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('charName').value.trim();
    const desc = document.getElementById('charDesc').value.trim();
    const greet = document.getElementById('charGreet').value.trim();
    const traits = document.getElementById('charTraits').value.trim();

    if (!name) {
      state.tg?.HapticFeedback?.notificationOccurred?.('error');
      if (state.tg?.showAlert) state.tg.showAlert('Введите имя персонажа');
      else alert('Введите имя персонажа');
      return;
    }

    const character = {
      name,
      description: desc,
      greeting: greet,
      traits,
      photo: selectedPhotoData,
      createdAt: Date.now()
    };

    // Здесь можно отправить данные в бэкенд / сохранить
    console.log('[Seily] Character created:', character);

    state.tg?.HapticFeedback?.notificationOccurred?.('success');

    const msg = `${name} готов к общению`;
    if (state.tg?.showPopup) {
      state.tg.showPopup({
        title: 'Персонаж создан!',
        message: msg,
        buttons: [{ type: 'ok' }]
      });
    } else {
      alert('Персонаж создан: ' + name);
    }

    resetForm();
    closeSheet();
  });

  function resetForm() {
    document.getElementById('charName').value = '';
    document.getElementById('charDesc').value = '';
    document.getElementById('charGreet').value = '';
    document.getElementById('charTraits').value = '';
    photoInput.value = '';
    selectedPhotoData = null;
    photoUpload.classList.remove('has-image');
    photoUpload.innerHTML = `
      <input type="file" id="charPhoto" accept="image/*" hidden>
      <i data-lucide="image-plus" size="22"></i>
      <span>Добавить фото</span>
      <div class="overlay-edit">
        <i data-lucide="pencil" size="22"></i>
      </div>
    `;
    // Re-bind input
    const newInput = photoUpload.querySelector('input');
    newInput.addEventListener('change', () => {
      const file = newInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedPhotoData = reader.result;
        photoUpload.classList.add('has-image');
        photoUpload.innerHTML = `
          <img src="${selectedPhotoData}" alt="">
          <div class="overlay-edit">
            <i data-lucide="pencil" size="22"></i>
          </div>
          <input type="file" id="charPhoto" accept="image/*" hidden>
        `;
        refreshIcons();
      };
      reader.readAsDataURL(file);
    });
    refreshIcons();
  }

  // ==================== Init ====================

  async function init() {
    // 1) Ждём Telegram SDK
    const tg = await waitForTelegram(3000);
    state.tg = tg;
    state.isTelegram = !!tg;

    if (tg) {
      try {
        tg.ready();
        tg.expand?.();
        tg.setHeaderColor?.('secondary_bg_color');
        tg.setBackgroundColor?.('bg_color');
        tg.enableClosingConfirmation?.();

        tg.onEvent?.('themeChanged', () => {
          updateThemeLabel();
          refreshIcons();
        });

        tg.onEvent?.('activated', () => {
          renderUser();
        });
      } catch (e) { console.warn('tg init warn', e); }
    }

    // 2) Ждём пользователя
    state.user = await waitForUser(tg, 3500);

    // 3) Рендерим
    renderUser();
    updateThemeLabel();
    refreshIcons();

    // 4) Навигация
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // 5) Search button
    document.getElementById('searchBtn')?.addEventListener('click', () => {
      state.tg?.HapticFeedback?.impactOccurred?.('light');
    });

    console.log('[Seily] Telegram:', state.isTelegram, 'user:', state.user);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>

</body>
</html>

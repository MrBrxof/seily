<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Seily</title>
<style>
  :root {
    --bg-color: var(--tg-theme-bg-color, #0f0f10);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
    --text-color: var(--tg-theme-text-color, #ffffff);
    --hint-color: var(--tg-theme-hint-color, #8e8e93);
    --accent: #7c5cff;
    --accent-2: #4a9eff;
    --border: rgba(128,128,128,0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-color);
    color: var(--text-color);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    opacity: 0;
    transition: opacity .15s ease;
  }
  body.ready { opacity: 1; }
  body.modal-open { overflow: hidden; }

  /* Header */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; flex-shrink: 0;
  }
  .app-logo {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--secondary-bg); border: none; color: var(--text-color);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s ease;
  }
  .header-btn:active { transform: scale(0.92); }

  /* Content */
  .content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 0 16px 100px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    contain: layout style paint;
  }
  .content::-webkit-scrollbar { display: none; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Empty */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 80px 20px; color: var(--hint-color); text-align: center;
  }
  .empty-state svg { opacity: 0.5; }
  .empty-state p { font-size: 15px; font-weight: 600; }
  .empty-state small { font-size: 13px; opacity: 0.7; max-width: 260px; line-height: 1.4; }

  /* Create tab */
  .create-intro { padding: 40px 0 20px; text-align: center; }
  .create-intro-icon {
    width: 72px; height: 72px; border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; color: #fff;
  }
  .create-intro h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .create-intro p { font-size: 14px; color: var(--hint-color); line-height: 1.4; }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 14px; padding: 15px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

  /* Account */
  .account-top { display: flex; flex-direction: column; align-items: center; padding: 24px 0 20px; }
  .account-avatar {
    width: 108px; height: 108px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 800; color: #fff;
    overflow: hidden; border: 3px solid var(--bg-color);
    box-shadow: 0 0 0 3px var(--accent);
    margin-bottom: 14px; position: relative;
  }
  .account-avatar img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .account-name { font-size: 20px; font-weight: 800; }
  .account-username { font-size: 14px; color: var(--hint-color); margin-top: 3px; }
  .account-hint {
    font-size: 12px; color: var(--hint-color); text-align: center;
    margin-top: 10px; max-width: 300px; line-height: 1.45; opacity: 0.85;
  }

  .account-list {
    background: var(--secondary-bg); border-radius: 18px;
    overflow: hidden; border: 1px solid var(--border); margin-top: 20px;
  }
  .account-row {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:active { background: rgba(128,128,128,0.12); }
  .account-row-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
  }
  .account-row-label { flex: 1; font-size: 15px; font-weight: 500; }
  .account-row-value { font-size: 13px; color: var(--hint-color); margin-right: 6px; }

  /* Debug block */
  .debug-block {
    margin-top: 20px; padding: 14px 16px;
    background: var(--secondary-bg); border-radius: 14px;
    border: 1px solid var(--border);
    font-size: 12px; color: var(--hint-color);
    line-height: 1.6; font-family: ui-monospace, Menlo, monospace;
    word-break: break-all;
  }
  .debug-block b { color: var(--text-color); font-weight: 600; }
  .debug-block .ok { color: #4ade80; }
  .debug-block .fail { color: #f87171; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--secondary-bg);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 4px; background: none; border: none; color: var(--hint-color);
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: color .15s ease, transform .15s ease;
    font-family: inherit;
  }
  .nav-item:active { transform: scale(0.94); }
  .nav-item.active { color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease; z-index: 200;
    will-change: opacity;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--secondary-bg);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translate3d(0, 100%, 0);
    transition: transform .32s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 201; max-height: 92vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
    scrollbar-width: none;
    will-change: transform;
  }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.open { transform: translate3d(0, 0, 0); }
  .sheet.dragging { transition: none; }

  .sheet-handle {
    width: 44px; height: 5px; background: var(--hint-color);
    opacity: 0.45; border-radius: 3px; margin: 0 auto 18px;
    cursor: grab; touch-action: none; position: relative;
    transition: opacity .2s ease;
  }
  .sheet-handle:active { opacity: 0.85; cursor: grabbing; }
  .sheet-handle::before {
    content: ''; position: absolute;
    top: -18px; left: -60px; right: -60px; bottom: -18px;
  }

  .sheet-title { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 22px; }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--hint-color); margin-bottom: 8px; padding-left: 4px;
  }
  .form-input, .form-textarea {
    width: 100%; background: var(--bg-color);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; font-size: 16px; color: var(--text-color);
    font-family: inherit; outline: none;
    transition: border-color .15s ease;
    -webkit-appearance: none; appearance: none;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 90px; resize: none; line-height: 1.5; }

  .photo-row { display: flex; justify-content: center; margin-bottom: 20px; }
  .photo-upload {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--bg-color); border: 2px dashed var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; color: var(--hint-color);
    font-size: 11px; font-weight: 600; overflow: hidden;
    position: relative; text-align: center;
    transition: border-color .15s ease, background .15s ease;
  }
  .photo-upload:active { border-color: var(--accent); background: rgba(124,92,255,0.06); }
  .photo-upload.has-image { border-style: solid; border-color: var(--accent); }
  .photo-upload > img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .photo-upload .overlay-edit {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff; opacity: 0; transition: opacity .2s ease; z-index: 2;
  }
  .photo-upload.has-image .overlay-edit { opacity: 1; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-ghost {
    flex: 1; background: rgba(128,128,128,0.14); color: var(--text-color);
    border: none; border-radius: 14px; padding: 15px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform .12s ease;
  }
  .btn-ghost:active { transform: scale(0.97); }
  .sheet-actions .btn-primary { flex: 2; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">Seily</div>
  <button class="header-btn" id="searchBtn" aria-label="Поиск" data-icon="search" data-size="20"></button>
</header>

<main class="content">

  <section class="tab-panel active" id="panel-home">
    <div class="empty-state">
      <div data-icon="inbox" data-size="48"></div>
      <p>Здесь пусто</p>
      <small>Создайте своего первого персонажа, чтобы начать</small>
    </div>
  </section>

  <section class="tab-panel" id="panel-chats">
    <div class="empty-state">
      <div data-icon="message-circle" data-size="48"></div>
      <p>Здесь пусто</p>
      <small>Ваши диалоги появятся здесь</small>
    </div>
  </section>

  <section class="tab-panel" id="panel-create">
    <div class="create-intro">
      <div class="create-intro-icon" data-icon="sparkles" data-size="32"></div>
      <h3>Создайте персонажа</h3>
      <p>Придумайте характер, внешность и стиль общения — и общайтесь</p>
    </div>
    <button class="btn-primary" id="openCreateBtn">
      <span data-icon="plus" data-size="18"></span>
      <span>Создать персонажа</span>
    </button>
  </section>

  <section class="tab-panel" id="panel-account">
    <div class="account-top">
      <div class="account-avatar" id="userAvatar">?</div>
      <div class="account-name" id="userName">Загрузка…</div>
      <div class="account-username" id="userUsername"></div>
      <div class="account-hint" id="userHint"></div>
    </div>

    <div class="account-list">
      <div class="account-row">
        <div class="account-row-icon" data-icon="user" data-size="18"></div>
        <div class="account-row-label">Профиль</div>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="settings" data-size="18"></div>
        <div class="account-row-label">Настройки</div>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="moon" data-size="18"></div>
        <div class="account-row-label">Тема</div>
        <span class="account-row-value" id="themeLabel">Auto</span>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
      <div class="account-row">
        <div class="account-row-icon" data-icon="info" data-size="18"></div>
        <div class="account-row-label">О приложении</div>
        <span class="account-row-value">v1.0</span>
        <div data-icon="chevron-right" data-size="18" style="color:var(--hint-color)"></div>
      </div>
    </div>

    <div class="debug-block" id="debugBlock"></div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="home">
    <span data-icon="home" data-size="22"></span>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-tab="chats">
    <span data-icon="message-circle" data-size="22"></span>
    <span>Чаты</span>
  </button>
  <button class="nav-item" data-tab="create">
    <span data-icon="plus-circle" data-size="22"></span>
    <span>Создать</span>
  </button>
  <button class="nav-item" data-tab="account">
    <span data-icon="user" data-size="22"></span>
    <span>Аккаунт</span>
  </button>
</nav>

<div class="modal-overlay" id="modalOverlay"></div>

<div class="sheet" id="createSheet" role="dialog" aria-modal="true">
  <div class="sheet-handle" id="sheetHandle"></div>
  <h2 class="sheet-title">Новый персонаж</h2>

  <div class="photo-row">
    <label class="photo-upload" id="photoUpload">
      <input type="file" id="charPhoto" accept="image/*" hidden>
      <span data-icon="image-plus" data-size="22"></span>
      <span>Добавить фото</span>
      <div class="overlay-edit">
        <span data-icon="pencil" data-size="22"></span>
      </div>
    </label>
  </div>

  <div class="form-group">
    <label class="form-label" for="charName">Имя</label>
    <input class="form-input" id="charName" type="text" placeholder="Например: Aiko" maxlength="40" autocomplete="off">
  </div>

  <div class="form-group">
    <label class="form-label" for="charDesc">Описание</label>
    <textarea class="form-textarea" id="charDesc" placeholder="Кто это, откуда, чем занимается…"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label" for="charGreet">Приветствие</label>
    <textarea class="form-textarea" id="charGreet" placeholder="Первое сообщение от персонажа…"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label" for="charTraits">Характеристика</label>
    <textarea class="form-textarea" id="charTraits" placeholder="Характер, манера общения, интересы…"></textarea>
  </div>

  <div class="sheet-actions">
    <button class="btn-ghost" id="cancelBtn">Отмена</button>
    <button class="btn-primary" id="saveBtn">
      <span data-icon="check" data-size="18"></span>
      <span>Создать</span>
    </button>
  </div>
</div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  'plus-circle': '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
  'image-plus': '<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><line x1="16" x2="22" y1="5" y2="5"/><line x1="19" x2="19" y1="2" y2="8"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>'
};

function renderIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach(el => {
    const name = el.dataset.icon;
    const path = ICONS[name];
    if (!path) return;
    const size = el.dataset.size || 24;
    el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
    el.removeAttribute('data-icon');
  });
}

/* =========================================================
   STATE
   ========================================================= */
const CACHE_KEY = 'seily_user_cache_v1';

const state = {
  tg: null,
  user: null,
  isTelegram: false,
  sdkLoaded: false,
  sdkSource: '—'
};

/* =========================================================
   USER CACHE (localStorage)
   ========================================================= */
function loadCachedUser() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // Кэш живёт 7 дней
    if (parsed.ts && (Date.now() - parsed.ts) > 7 * 24 * 3600 * 1000) {
      localStorage.removeItem(CACHE_KEY);
      return null;
    }
    return parsed.user || null;
  } catch { return null; }
}

function saveCachedUser(user) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ user, ts: Date.now() }));
  } catch {}
}

/* =========================================================
   TELEGRAM
   ========================================================= */
function readUser(tg) {
  if (!tg) return null;
  const unsafe = tg.initDataUnsafe?.user;
  if (unsafe && unsafe.id) return unsafe;
  const raw = tg.initData;
  if (raw) {
    try {
      const params = new URLSearchParams(raw);
      const u = params.get('user');
      if (u) {
        const parsed = JSON.parse(u);
        if (parsed && parsed.id) return parsed;
      }
    } catch {}
  }
  return null;
}

function trySyncTelegram() {
  const tg = window.Telegram?.WebApp;
  if (!tg) return false;

  state.tg = tg;
  state.sdkLoaded = true;

  // Проверяем: реально ли мы в WebApp окружении?
  // initData непустой или initDataUnsafe.user есть — значит настоящий WebApp
  const realUser = readUser(tg);
  const hasInitData = !!(tg.initData && tg.initData.length > 0);

  state.isTelegram = hasInitData || !!realUser;

  if (state.isTelegram) {
    try {
      tg.ready();
      tg.expand?.();
      tg.setHeaderColor?.('secondary_bg_color');
      tg.setBackgroundColor?.('bg_color');
      tg.enableClosingConfirmation?.();
      tg.onEvent?.('themeChanged', updateThemeLabel);
      tg.onEvent?.('activated', () => {
        const u = readUser(tg);
        if (u) {
          state.user = u;
          saveCachedUser(u);
          renderUser();
          renderDebug();
        }
      });
    } catch (e) { console.warn('tg init', e); }
  }

  if (realUser) {
    state.user = realUser;
    saveCachedUser(realUser);
  }

  return true;
}

/* =========================================================
   SDK LOADER с резервными CDN
   ========================================================= */
function loadTelegramSdk() {
  const sources = [
    { url: 'https://telegram.org/js/telegram-web-app.js', name: 'telegram.org' },
    { url: 'https://cdn.jsdelivr.net/npm/@telegram-apps/sdk@latest/dist/telegram-web-app.js', name: 'jsdelivr' },
    { url: 'https://unpkg.com/@telegram-apps/sdk@latest/dist/telegram-web-app.js', name: 'unpkg' }
  ];

  return new Promise(resolve => {
    // Если SDK уже есть (например, загружен через <script async> в HTML) — ок
    if (window.Telegram?.WebApp) {
      state.sdkSource = 'inline';
      return resolve(true);
    }

    let index = 0;

    function tryNext() {
      if (index >= sources.length) return resolve(false);
      const src = sources[index++];

      const script = document.createElement('script');
      script.src = src.url;
      script.async = true;
      let done = false;

      const timeout = setTimeout(() => {
        if (done) return;
        done = true;
        script.remove();
        tryNext();
      }, 4000);

      script.onload = () => {
        if (done) return;
        done = true;
        clearTimeout(timeout);
        if (window.Telegram?.WebApp) {
          state.sdkSource = src.name;
          resolve(true);
        } else {
          tryNext();
        }
      };

      script.onerror = () => {
        if (done) return;
        done = true;
        clearTimeout(timeout);
        script.remove();
        tryNext();
      };

      document.head.appendChild(script);
    }

    tryNext();
  });
}

/* =========================================================
   RENDER USER
   ========================================================= */
function renderUser() {
  const avatarEl   = document.getElementById('userAvatar');
  const nameEl     = document.getElementById('userName');
  const usernameEl = document.getElementById('userUsername');
  const hintEl     = document.getElementById('userHint');

  if (state.user) {
    const u = state.user;
    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Пользователь';
    const initial  = (u.first_name || fullName || '?').trim().charAt(0).toUpperCase() || '?';

    nameEl.textContent = fullName;
    usernameEl.textContent = u.username ? '@' + u.username : (u.id ? 'ID: ' + u.id : '');
    hintEl.textContent = state.isTelegram ? '' : 'Данные из кэша (открыто вне Telegram)';

    if (u.photo_url) {
      const existing = avatarEl.querySelector('img');
      if (existing && existing.src === u.photo_url) return;
      if (existing) existing.remove();
      avatarEl.textContent = '';
      const img = new Image();
      img.referrerPolicy = 'no-referrer';
      img.decoding = 'async';
      img.onload = () => { avatarEl.textContent = ''; avatarEl.appendChild(img); };
      img.onerror = () => { avatarEl.textContent = initial; };
      img.src = u.photo_url;
    } else {
      avatarEl.textContent = initial;
    }
    return;
  }

  avatarEl.textContent = '?';

  if (state.isTelegram) {
    nameEl.textContent = 'Профиль недоступен';
    usernameEl.textContent = '';
    hintEl.textContent = 'Telegram не передал данные. Перезапустите Web App.';
  } else if (state.sdkLoaded) {
    nameEl.textContent = 'Вне Telegram';
    usernameEl.textContent = '';
    hintEl.textContent = 'Откройте приложение через кнопку в боте: t.me/ваш_бот/имя_приложения';
  } else {
    nameEl.textContent = 'Вне Telegram';
    usernameEl.textContent = '';
    hintEl.textContent = 'Откройте приложение через кнопку в боте: t.me/ваш_бот/имя_приложения';
  }
}

/* =========================================================
   DEBUG
   ========================================================= */
function renderDebug() {
  const el = document.getElementById('debugBlock');
  if (!el) return;

  const hasSdk = !!window.Telegram?.WebApp;
  const hasInitData = !!(state.tg?.initData);
  const initLen = state.tg?.initData ? state.tg.initData.length : 0;
  const hasUser = !!state.user;
  const platform = state.tg?.platform || '—';
  const version = state.tg?.version || '—';

  const mark = (ok) => ok ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';

  el.innerHTML = `
    <div><b>Диагностика</b></div>
    <div>${mark(hasSdk)} window.Telegram.WebApp <span style="opacity:.6">(источник: ${state.sdkSource})</span></div>
    <div>${mark(hasInitData)} initData <span style="opacity:.6">(${initLen} симв.)</span></div>
    <div>${mark(hasUser)} user</div>
    <div>${mark(state.isTelegram)} в WebApp окружении</div>
    <div>platform: ${platform}</div>
    <div>tg version: ${version}</div>
    <div>UA: ${navigator.userAgent.slice(0, 60)}…</div>
  `;
}

/* =========================================================
   THEME
   ========================================================= */
function updateThemeLabel() {
  const el = document.getElementById('themeLabel');
  if (!el) return;
  const scheme = state.tg?.colorScheme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  el.textContent = scheme === 'dark' ? 'Dark' : 'Light';
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tabName) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('panel-' + tabName)?.classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tabName}"]`)?.classList.add('active');
  document.querySelector('.content')?.scrollTo({ top: 0, behavior: 'auto' });
  if (tabName === 'account') renderDebug();
  state.tg?.HapticFeedback?.selectionChanged?.();
}

/* =========================================================
   BOTTOM SHEET
   ========================================================= */
const sheet = document.getElementById('createSheet');
const overlay = document.getElementById('modalOverlay');
const handle = document.getElementById('sheetHandle');

function openSheet() {
  overlay.classList.add('open');
  sheet.classList.add('open');
  document.body.classList.add('modal-open');
  state.tg?.HapticFeedback?.impactOccurred?.('medium');
}

function closeSheet() {
  overlay.classList.remove('open');
  sheet.classList.remove('open');
  document.body.classList.remove('modal-open');
  sheet.style.transform = '';
  state.tg?.HapticFeedback?.impactOccurred?.('light');
}

let dragStartY = 0, dragDelta = 0, isDragging = false, isDraggingSheet = false;

function dragStart(y, fromSheet) {
  isDragging = true;
  isDraggingSheet = fromSheet;
  dragStartY = y;
  dragDelta = 0;
  sheet.classList.add('dragging');
}

function dragMove(y) {
  if (!isDragging) return;
  dragDelta = y - dragStartY;
  if (dragDelta < 0) dragDelta = 0;
  sheet.style.transform = `translate3d(0, ${dragDelta}px, 0)`;
}

function dragEnd() {
  if (!isDragging) return;
  isDragging = false;
  sheet.classList.remove('dragging');
  if (dragDelta > 110) closeSheet();
  else sheet.style.transform = '';
  dragDelta = 0;
}

/* =========================================================
   PHOTO UPLOAD
   ========================================================= */
const photoInput = document.getElementById('charPhoto');
const photoUpload = document.getElementById('photoUpload');
let selectedPhotoData = null;

photoInput.addEventListener('change', () => {
  const file = photoInput.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    selectedPhotoData = reader.result;
    const existingImg = photoUpload.querySelector('img');
    if (existingImg) existingImg.remove();
    const img = document.createElement('img');
    img.src = selectedPhotoData;
    img.alt = '';
    photoUpload.insertBefore(img, photoUpload.firstChild);
    photoUpload.classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

function resetPhoto() {
  selectedPhotoData = null;
  const existingImg = photoUpload.querySelector('img');
  if (existingImg) existingImg.remove();
  photoUpload.classList.remove('has-image');
  photoInput.value = '';
}

/* =========================================================
   BOOT
   ========================================================= */
async function boot() {
  renderIcons();
  document.body.classList.add('ready');

  // 1) Сразу показываем кэш (если есть) — чтобы UI не был пустым
  const cached = loadCachedUser();
  if (cached) {
    state.user = cached;
    renderUser();
  }

  // 2) Пробуем синхронно — если SDK уже здесь
  trySyncTelegram();

  // 3) Грузим SDK с резервных CDN (если ещё нет)
  if (!state.sdkLoaded) {
    const ok = await loadTelegramSdk();
    if (ok) trySyncTelegram();
  }

  // 4) Рендер
  renderUser();
  updateThemeLabel();
  renderDebug();

  // 5) UI подписки
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('searchBtn').addEventListener('click', () => {
    state.tg?.HapticFeedback?.impactOccurred?.('light');
  });

  document.getElementById('openCreateBtn').addEventListener('click', openSheet);
  overlay.addEventListener('click', closeSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);

  handle.addEventListener('touchstart', e => dragStart(e.touches[0].clientY, true), { passive: true });
  handle.addEventListener('mousedown', e => { e.preventDefault(); dragStart(e.clientY, true); });

  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop <= 0) dragStart(e.touches[0].clientY, false);
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const y = e.touches[0].clientY;
    if (isDraggingSheet || dragDelta > 0 || (y - dragStartY) > 0) {
      dragMove(y);
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchend', dragEnd);
  document.addEventListener('touchcancel', dragEnd);
  document.addEventListener('mousemove', e => { if (isDragging) dragMove(e.clientY); });
  document.addEventListener('mouseup', dragEnd);

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name   = document.getElementById('charName').value.trim();
    const desc   = document.getElementById('charDesc').value.trim();
    const greet  = document.getElementById('charGreet').value.trim();
    const traits = document.getElementById('charTraits').value.trim();

    if (!name) {
      state.tg?.HapticFeedback?.notificationOccurred?.('error');
      if (state.tg?.showAlert) state.tg.showAlert('Введите имя персонажа');
      else alert('Введите имя персонажа');
      return;
    }

    const character = { name, description: desc, greeting: greet, traits, photo: selectedPhotoData, createdAt: Date.now() };
    console.log('[Seily] Character:', character);
    state.tg?.HapticFeedback?.notificationOccurred?.('success');

    if (state.tg?.showPopup) {
      state.tg.showPopup({
        title: 'Персонаж создан!',
        message: `${name} готов к общению`,
        buttons: [{ type: 'ok' }]
      });
    } else {
      alert('Персонаж создан: ' + name);
    }

    document.getElementById('charName').value = '';
    document.getElementById('charDesc').value = '';
    document.getElementById('charGreet').value = '';
    document.getElementById('charTraits').value = '';
    resetPhoto();
    closeSheet();
  });

  // 6) Фоновое ожидание initData (если он приходит с задержкой)
  if (state.isTelegram && !state.user) {
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      const u = readUser(state.tg);
      if (u) {
        state.user = u;
        saveCachedUser(u);
        renderUser();
        renderDebug();
        clearInterval(t);
      }
      if (tries >= 20) clearInterval(t);
    }, 250);
  }

  console.log('[Seily] boot', { sdk: state.sdkLoaded, source: state.sdkSource, isTelegram: state.isTelegram, user: state.user });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
